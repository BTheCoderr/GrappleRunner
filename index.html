<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#8ed8ff"><meta name="apple-mobile-web-app-capable" content="yes"><title>GrappleRunner</title><link rel="stylesheet" href="/src/style.css"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="game"></div><div id="hud"><div id="topbar"><div class="pill"><span>LEVEL</span><strong id="levelLabel">1</strong></div><div class="pill"><span>SPEED</span><strong id="speedLabel">0</strong></div><div class="pill"><span>BEST</span><strong id="bestLabel">--</strong></div></div><div id="progress"><div id="progressFill"></div></div><div id="targetHint">HOLD TO GRAPPLE</div><div id="crosshair"></div><div id="toast"></div></div><div id="startScreen" class="overlay visible"><div class="panel"><div class="eyebrow">MOVEMENT PROTOTYPE</div><h1>Run. Grapple. Fly.</h1><p>Hold anywhere to hook the next glowing anchor. Release at the right moment and carry your momentum across the rooftops.</p><button id="startButton">START RUN</button><small>Touch / mouse hold · Spacebar works too</small></div></div><div id="finishScreen" class="overlay"><div class="panel"><div class="eyebrow">LEVEL CLEAR</div><h1 id="finishTime">0.00s</h1><p>Keep the momentum going.</p><button id="nextButton">NEXT LEVEL</button></div></div><script type="module" src="/src/main.js"></script></body></html>
